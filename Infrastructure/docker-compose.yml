name: macchannel-local

services:
  secret-init:
    build:
      context: ..
      dockerfile: Infrastructure/secrets/Dockerfile
    volumes:
      - stack_secrets:/stack-secrets
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  postgres:
    image: postgres:17.11-alpine3.24@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    depends_on:
      secret-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: macchannel
      POSTGRES_USER: macchannel
      # The official entrypoint reads this as root, then drops to postgres.
      POSTGRES_PASSWORD_FILE: /stack-secrets/postgres-password
    volumes:
      - stack_secrets:/stack-secrets:ro
      - postgres_data:/var/lib/postgresql/data
      - ../Services/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U macchannel -d macchannel"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  rendezvous:
    build:
      context: ..
      dockerfile: Infrastructure/rendezvous/Dockerfile
    depends_on:
      secret-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: macchannel
      POSTGRES_USER: macchannel
      POSTGRES_PASSWORD_FILE: /run/macchannel/postgres-password
      POSTGRES_SSLMODE: disable
      RENDEZVOUS_ADDR: ":8080"
      RENDEZVOUS_TLS_ADDR: ":8443"
      RENDEZVOUS_TLS_CERT_FILE: /run/macchannel/localhost.pem
      RENDEZVOUS_TLS_KEY_FILE: /run/macchannel/localhost-key.pem
      TURN_SHARED_SECRET_FILE: /run/macchannel/turn-shared-secret
      TURN_URLS: stun:stun.cloudflare.com:3478,turn:${TURN_EXTERNAL_IP:-127.0.0.1}:3478?transport=udp,turn:${TURN_EXTERNAL_IP:-127.0.0.1}:3478?transport=tcp,turns:localhost:5349?transport=tcp
      MACCHANNEL_ALLOWED_WS_ORIGINS: https://localhost:8443
    volumes:
      - stack_secrets:/stack-secrets:ro
    networks:
      - backend
      - edge
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8443:8443"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /run/macchannel:size=1m,uid=0,gid=0,mode=0700
    cap_drop:
      - ALL
    cap_add:
      # PID 1 reads the 0600 volume files, copies/chowns, then setuid clears all.
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s
    restart: unless-stopped

  coturn:
    build:
      context: ..
      dockerfile: Infrastructure/coturn/Dockerfile
    depends_on:
      secret-init:
        condition: service_completed_successfully
    environment:
      # Clean-checkout Docker Desktop default; the runner supplies a verified
      # LAN/deployment IPv4 for real relay use.
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:-host.docker.internal}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - stack_secrets:/stack-secrets:ro
    networks:
      - relay
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/tcp"
      - "49160-49200:49160-49200/udp"
      - "49160-49200:49160-49200/tcp"
      - "127.0.0.1:9641:9641"
    read_only: true
    tmpfs:
      - /run/coturn:size=1m,uid=65534,gid=65534,mode=0700
      - /var/lib/coturn:size=1m,uid=65534,gid=65534,mode=0700
      - /tmp:size=4m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "turnutils_stunclient", "-p", "3478", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
  stack_secrets:

networks:
  backend:
    internal: true
  edge:
  relay:

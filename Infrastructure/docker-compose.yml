name: macchannel-local

services:
  postgres:
    image: postgres:17.11-alpine3.24@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: macchannel
      POSTGRES_USER: macchannel
      # The official entrypoint reads this while PID 1 is root, then drops to postgres.
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../Services/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U macchannel -d macchannel"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  rendezvous:
    build:
      context: ..
      dockerfile: Infrastructure/rendezvous/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: macchannel
      POSTGRES_USER: macchannel
      POSTGRES_PASSWORD_FILE: /run/macchannel/postgres-password
      POSTGRES_SSLMODE: disable
      RENDEZVOUS_ADDR: ":8080"
      RENDEZVOUS_TLS_ADDR: ":8443"
      RENDEZVOUS_TLS_CERT_FILE: /run/macchannel/localhost.pem
      RENDEZVOUS_TLS_KEY_FILE: /run/macchannel/localhost-key.pem
      TURN_SHARED_SECRET_FILE: /run/macchannel/turn-shared-secret
      TURN_URLS: stun:localhost:3478,turn:localhost:3478?transport=udp,turn:localhost:3478?transport=tcp,turns:localhost:5349?transport=tcp
      MACCHANNEL_ALLOWED_WS_ORIGINS: https://localhost:8443
    secrets:
      - postgres_password
      - turn_shared_secret
      - localhost_cert
      - localhost_key
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8443:8443"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /run/macchannel:size=1m,uid=0,gid=0,mode=0700
    cap_drop:
      - ALL
    cap_add:
      # PID 1 needs only enough privilege to read the 0600 bind secrets, copy,
      # chown, and drop identity. Linux clears these when setuid(65532) succeeds.
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s
    restart: unless-stopped

  coturn:
    build:
      context: ..
      dockerfile: Infrastructure/coturn/Dockerfile
    environment:
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:?Run Scripts/run-local-stack.sh or set TURN_EXTERNAL_IP}
    secrets:
      - turn_shared_secret
      - localhost_cert
      - localhost_key
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/tcp"
      - "49160-49200:49160-49200/udp"
      - "49160-49200:49160-49200/tcp"
      - "127.0.0.1:9641:9641"
    read_only: true
    tmpfs:
      - /run/coturn:size=1m,uid=65534,gid=65534,mode=0700
      - /var/lib/coturn:size=1m,uid=65534,gid=65534,mode=0700
      - /tmp:size=4m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "turnutils_stunclient", "-p", "3478", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:

secrets:
  postgres_password:
    file: ${MACCHANNEL_SECRET_ROOT:?Run Scripts/run-local-stack.sh}/postgres-password
  turn_shared_secret:
    file: ${MACCHANNEL_SECRET_ROOT:?Run Scripts/run-local-stack.sh}/turn-shared-secret
  localhost_cert:
    file: ${MACCHANNEL_SECRET_ROOT:?Run Scripts/run-local-stack.sh}/tls/localhost.pem
  localhost_key:
    file: ${MACCHANNEL_SECRET_ROOT:?Run Scripts/run-local-stack.sh}/tls/localhost-key.pem

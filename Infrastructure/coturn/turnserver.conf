listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0
realm=localhost

fingerprint
use-auth-secret
stale-nonce=600
no-cli
no-multicast-peers
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=::1
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
no-dtls
no-tcp-relay
no-software-attribute

cert=/run/coturn/secrets/localhost.pem
pkey=/run/coturn/secrets/localhost-key.pem
cipher-list=HIGH:!aNULL:!MD5:!3DES

prometheus
prometheus-port=9641
user-quota=8
total-quota=256
max-bps=104857600
bps-capacity=1073741824
max-allocate-lifetime=600
channel-lifetime=600
permission-lifetime=300
min-port=49160
max-port=49200

log-file=/dev/null
no-stdout-log
# Upstream simple-log keeps the configured path exact instead of appending a
# PID/date, so coturn cannot fall back to a generated /tmp log filename.
simple-log

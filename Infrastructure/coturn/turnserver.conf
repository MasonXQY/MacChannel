listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0
realm=localhost

fingerprint
use-auth-secret
stale-nonce=600
no-cli
no-multicast-peers
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=::1
no-dtls
no-tcp-relay
no-software-attribute

cert=/run/secrets/localhost_cert
pkey=/run/secrets/localhost_key
tls-cipher-list=HIGH:!aNULL:!MD5:!3DES

prometheus
prometheus-port=9641
user-quota=8
total-quota=256
max-bps=104857600
bps-capacity=1073741824
max-allocate-lifetime=600
channel-lifetime=600
permission-lifetime=300
min-port=49160
max-port=49200

log-file=stdout
no-stdout-log
simple-log
new-log-timestamp
log-min-level=error

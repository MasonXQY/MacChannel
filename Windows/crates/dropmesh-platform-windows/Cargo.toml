[package]
name = "dropmesh-platform-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dropmesh-identity = { path = "../dropmesh-identity" }
sha2.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tempfile.workspace = true

# The workspace forbids unsafe code. This adapter needs narrowly scoped FFI
# calls, so it owns an equivalent local lint policy and allows unsafe only in
# its Windows implementation modules.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
unwrap_used = "deny"
expect_used = "deny"

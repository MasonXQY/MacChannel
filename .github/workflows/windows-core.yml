name: Windows core

on:
  workflow_dispatch:
  push:
    paths:
      - "Windows/**"
      - "Protocol/**"
      - "Scripts/test-windows-core.sh"
      - ".github/workflows/windows-core.yml"
  pull_request:
    paths:
      - "Windows/**"
      - "Protocol/**"
      - "Scripts/test-windows-core.sh"
      - ".github/workflows/windows-core.yml"

permissions:
  contents: read

concurrency:
  group: windows-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install the pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup default 1.97.1

      - name: Verify formatting
        working-directory: Windows
        run: cargo fmt --all -- --check

      - name: Run the complete portable and Windows test suite
        working-directory: Windows
        run: cargo test --locked --workspace --all-targets

      - name: Reject Rust warnings
        working-directory: Windows
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Install the pinned dependency auditor
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Reject known dependency vulnerabilities
        working-directory: Windows
        run: cargo audit --file Cargo.lock --deny warnings

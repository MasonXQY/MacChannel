name: Public service acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-service-acceptance
  cancel-in-progress: false

jobs:
  cross-network-transfer:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Exercise direct ICE, forced TURN, and one GiB resume
        env:
          MACCHANNEL_E2E_STACK: "1"
          MACCHANNEL_E2E_STACK_ORIGIN: https://channel.zensys-tech.com
        run: swift test --no-parallel --filter TransferIntegrationTests

name: Publish service images

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "Services/rendezvous/**"
      - "Infrastructure/rendezvous/**"
      - "Infrastructure/coturn/**"
      - ".github/workflows/publish-service-images.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: service-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: rendezvous
            image: ghcr.io/masonxqy/macchannel-rendezvous
            dockerfile: Infrastructure/rendezvous/Dockerfile
          - component: coturn
            image: ghcr.io/masonxqy/macchannel-coturn
            dockerfile: Infrastructure/coturn/Dockerfile
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Enable cross-architecture builds
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Create isolated BuildKit builder
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Choose immutable and human-readable tags
        id: image
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            readable_tag="${GITHUB_REF_NAME}"
          else
            readable_tag="edge"
          fi
          {
            echo "tags<<EOF"
            echo "${IMAGE}:sha-${GITHUB_SHA}"
            echo "${IMAGE}:${readable_tag}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and publish ${{ matrix.component }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          sbom: true
          provenance: mode=max

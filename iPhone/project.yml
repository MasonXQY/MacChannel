name: DropMesh
options:
  bundleIdPrefix: com.zensystech.dropmesh
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.4"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
packages:
  DropMeshPackage:
    path: ..
targets:
  DropMesh:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Resources
    dependencies:
      - package: DropMeshPackage
        product: DropMeshMobileRuntime
      - package: DropMeshPackage
        product: MacChannelCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zensystech.dropmesh.iphone.dev
        PRODUCT_NAME: DropMesh
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  DropMeshTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/Unit
    dependencies:
      - target: DropMesh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zensystech.dropmesh.iphone.dev.tests
        GENERATE_INFOPLIST_FILE: YES
  DropMeshUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UI
    dependencies:
      - target: DropMesh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zensystech.dropmesh.iphone.dev.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  DropMesh:
    build:
      targets:
        DropMesh: all
        DropMeshTests: [test]
        DropMeshUITests: [test]
    test:
      targets:
        - DropMeshTests
        - DropMeshUITests
